<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Search</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23B855C7' d='M135.2 117.4L109.1 192H402.9l-26.1-74.6C372.3 104.6 360.2 96 346.6 96H165.4c-13.6 0-25.7 8.6-30.2 21.4zM39.6 196.8L74.8 96.3C88.3 57.8 124.6 32 165.4 32H346.6c40.8 0 77.1 25.8 90.6 64.3l35.2 100.5c23.2 9.6 39.6 32.5 39.6 59.2V304c0 17.7-14.3 32-32 32H448c0 53-43 96-96 96s-96-43-96-96H256c0 53-43 96-96 96s-96-43-96-96H32c-17.7 0-32-14.3-32-32V256c0-26.7 16.4-49.6 39.6-59.2zM128 288a32 32 0 1 1 0 64 32 32 0 1 1 0-64zm288 32a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z'/></svg>" type="image/svg+xml">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="search-section">
            <div class="row g-3 align-items-center">
                <div class="col-auto">
                    <select class="form-select" id="searchType">
                        <option value="">Search by</option>
                        <option value="userId">User ID</option>
                        <option value="location">Parking Spot by Location</option>
                        <option value="email">User Email</option>
                        <option value="lotName">Parking Lot Name</option>
                    </select>
                </div>
                <div class="col">
                    <input type="text" class="form-control" id="searchQuery" 
                           placeholder="Enter search string" onkeypress="handleKeyPress(event)">
                </div>
                <div class="col-auto">
                    <button class="btn-add-lot" onclick="performSearch()">
                        <i class="fas fa-search"></i> Search
                    </button>
                </div>
                <div class="col-auto">
                    <button class="btn-delete-lot" onclick="clearSearch()">
                        <i class="fas fa-times"></i> Clear
                    </button>
                </div>
            </div>
            <div class="mt-4" id="searchResultsContainer">        
                <div class="search-results" id="searchResults">
                  
                </div>
            </div>
        </div>
    </div>

    <script>
        
        async function performSearch() {
            const searchType = document.getElementById('searchType').value;
            const query = document.getElementById('searchQuery').value.trim();
            const resultsContainer = document.getElementById('searchResults');        
               
            resultsContainer.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> Searching...</div>';
            try {
                let results = [];

                if (searchType === 'location') {
                    results = await searchByLocation(query);
                } else if (searchType === 'userId') {
                    results = await searchByUserId(query);
                } else if (searchType === 'email') {
                    results = await searchByEmail(query);
                } else if (searchType === 'lotName') {
                    results = await searchByLotName(query);
                }

                displayResults(results, searchType);
            } catch (error) {
                console.error('Search error:', error);
                resultsContainer.innerHTML = `<div class="error-message">Search failed: ${error.message}</div>`;
            }
        }
        async function searchByLocation(location) {
            try {
                const response = await fetch('/api/lots');
                if (!response.ok) throw new Error('Failed to fetch parking lots');
                
                const allLots = await response.json();
                return allLots.filter(lot => 
                    lot.address.toLowerCase().includes(location.toLowerCase()) ||
                    lot.name.toLowerCase().includes(location.toLowerCase())
                );
            } catch (error) {
                throw new Error('Failed to search by location');
            }
        }
        async function searchByUserId(userId) {
            try {
                const response = await fetch('/api/users');
                if (!response.ok) throw new Error('Failed to fetch users');
                
                const users = await response.json();
                const user = users.find(u => u.id.toString() === userId.toString());
                
                if (!user) return [];
                const lotsResponse = await fetch('/api/lots');
                const lots = await lotsResponse.json();
                
                const userParkingInfo = [];
                lots.forEach(lot => {                    
                    userParkingInfo.push({
                        user: user,
                        parkingLot: lot,
                        searchType: 'userId'
                    });
                });                
                return userParkingInfo.length > 0 ? [userParkingInfo[0]] : [];
            } catch (error) {
                throw new Error('Failed to search by user ID');
            }
        }
        async function searchByEmail(email) {
            try {
                const response = await fetch('/api/users');
                if (!response.ok) throw new Error('Failed to fetch users');
                
                const users = await response.json();
                const user = users.find(u => u.email.toLowerCase().includes(email.toLowerCase()));
                
                if (!user) return [];

                return [{
                    user: user,
                    searchType: 'email'
                }];
            } catch (error) {
                throw new Error('Failed to search by email');
            }
        }
        async function searchByLotName(lotName) {
            try {
                const response = await fetch('/api/lots');
                if (!response.ok) throw new Error('Failed to fetch parking lots');
                
                const allLots = await response.json();
                return allLots.filter(lot => 
                    lot.name.toLowerCase().includes(lotName.toLowerCase())
                );
            } catch (error) {
                throw new Error('Failed to search by lot name');
            }
        }
        function displayResults(results, searchType) {
            const resultsContainer = document.getElementById('searchResults');
            
            if (results.length === 0) {
                resultsContainer.innerHTML = '<div class="no-results"><i class="fas fa-search"></i><br>No results found</div>';
                return;
            }

            let html = '';

            if (searchType === 'location' || searchType === 'lotName') {
                results.forEach(lot => {
                    html += createParkingLotHTML(lot);
                });
            } else if (searchType === 'userId' || searchType === 'email') {
                results.forEach(info => {
                    html += createUserInfoHTML(info);
                });
            }

            resultsContainer.innerHTML = html;
        }
        function createParkingLotHTML(lot) {
            const occupiedSpots = lot.occupiedSpots || 0;
            const totalSpots = lot.totalSpots || 0;
            const occupancyRate = totalSpots > 0 ? ((occupiedSpots/totalSpots)*100).toFixed(1) : 0;

            return `
                <div class="parking-lot">
                    <div class="d-flex justify-content-between">
                        <h5>${lot.name} <small class="text-muted">(${lot.address})</small></h5>
                        <div>
                            
                        </div>
                    </div>
                    <div class="occupancy-info">
                        Occupied: ${occupiedSpots}/${totalSpots} 
                        (${occupancyRate}% full) | Price: ₹${lot.pricePerHour}/hour
                        ${lot.pinCode ? `| PIN: ${lot.pinCode}` : ''}
                    </div>
                    <div class="parking-grid" style="grid-template-columns: repeat(${Math.min(totalSpots, 5)}, 1fr);">
                        ${createSpotsHTML(lot)}
                    </div>
                </div>
            `;
        }
        function createSpotsHTML(lot) {
            if (!lot.spots || !Array.isArray(lot.spots)) {
                let spotsHTML = '';
                for (let i = 1; i <= lot.totalSpots; i++) {
                    const isOccupied = i <= lot.occupiedSpots;
                    const spotClass = isOccupied ? 'spot-occupied' : 'spot-available';
                    spotsHTML += `
                        <div class="spot ${spotClass}" 
                             title="Spot ${i} - ${isOccupied ? 'Occupied' : 'Available'}"
                             onclick="spotClick('${lot.id}', ${i})">
                            ${i}
                        </div>
                    `;
                }
                return spotsHTML;
            }

            return lot.spots.map(spot => `
                <div class="spot spot-${spot.occupied ? 'occupied' : 'available'}" 
                     title="Spot ${spot.id} - ${spot.occupied ? 'Occupied' : 'Available'}"
                     onclick="spotClick('${lot.id}', ${spot.id})">
                    ${spot.id}
                </div>
            `).join('');
        }
        function createUserInfoHTML(info) {
            const user = info.user;
            return `
                <div class="user-info">
                    <div class="row">
                        <div class="col-md-6">
                            <h6><i class="fas fa-user"></i> User Information</h6>
                            <p><strong>ID:</strong> ${user.id}</p>
                            <p><strong>Name:</strong> ${user.fullName}</p>
                            <p><strong>Email:</strong> ${user.email}</p>
                            <p><strong>Address:</strong> ${user.address}</p>
                            <p><strong>PIN Code:</strong> ${user.pinCode}</p>
                          
                        </div>
                       
                </div>
            `;
        }
        function clearSearch() {
            document.getElementById('searchType').value = '';
            document.getElementById('searchQuery').value = '';
            document.getElementById('searchResults').innerHTML = '';
        }
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        } 
        document.getElementById('searchType').addEventListener('change', function() {
            const searchQuery = document.getElementById('searchQuery');
            const placeholders = {
                'userId': 'Enter User ID (e.g., 1, 2, 3)',
                'location': 'Enter location (e.g., Velachery, T Nagar)',
                'email': 'Enter email address',
                'lotName': 'Enter parking lot name'
            };
            searchQuery.placeholder = placeholders[this.value] || 'Enter search string';
        });
    </script>
</body>
</html>
