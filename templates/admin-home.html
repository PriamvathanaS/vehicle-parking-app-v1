<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Lots Management</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23B855C7' d='M135.2 117.4L109.1 192H402.9l-26.1-74.6C372.3 104.6 360.2 96 346.6 96H165.4c-13.6 0-25.7 8.6-30.2 21.4zM39.6 196.8L74.8 96.3C88.3 57.8 124.6 32 165.4 32H346.6c40.8 0 77.1 25.8 90.6 64.3l35.2 100.5c23.2 9.6 39.6 32.5 39.6 59.2V304c0 17.7-14.3 32-32 32H448c0 53-43 96-96 96s-96-43-96-96H256c0 53-43 96-96 96s-96-43-96-96H32c-17.7 0-32-14.3-32-32V256c0-26.7 16.4-49.6 39.6-59.2zM128 288a32 32 0 1 1 0 64 32 32 0 1 1 0-64zm288 32a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z'/></svg>" type="image/svg+xml">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="header-controls">
        <div>
            <button class="btn btn-add-lot" onclick="toggleAddLotForm()">
                <i class="fas fa-plus me-2"></i>Add New Lot
            </button>
        </div>
        
        <div class="legend-compact" id="legend" style="display: none;">
            <div class="d-flex align-items-center">
                <div class="legend-item">
                    <div class="legend-spot spot-available"></div>
                    <span>Available</span>
                </div>
                <div class="legend-item">
                    <div class="legend-spot spot-occupied"></div>
                    <span>Occupied</span>
                </div>
            </div>
        </div>
    </div>
    <div id="addLotForm" class="add-lot-form">
        <h5 class="mb-3">Add New Parking Lot</h5>
        <form id="lotForm" onsubmit="handleFormSubmit(event)">
            <div class="row">
                <div class="col-md-4">
                    <label class="form-label">Location Name:</label>
                    <input type="text" class="form-control" id="lotName" placeholder="Location" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Address:</label>
                    <input type="text" class="form-control" id="address" placeholder="123 Main Street" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Pin Code:</label>
                    <input type="text" class="form-control" id="pinCode" placeholder="400010" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Price/Hour (₹):</label>
                    <input type="number" class="form-control" id="pricePerHour" value="20" min="1" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Maximum Spots:</label>
                    <input type="number" class="form-control" id="lotSpots" value="10" min="5" max="50" required>
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button type="submit" class="btn btn-success me-2">
                        <i class="fas fa-check me-1"></i>Add
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="toggleAddLotForm()">
                        <i class="fas fa-times me-1"></i>Cancel
                    </button>
                </div>
            </div>
        </form>
    </div>
    <div id="emptyState" class="empty-state">
        <i class="fas fa-parking"></i>
        <h4>No Parking Lots Created Yet</h4>   
    </div>
    <div id="parkingLotsContainer" class="parking-lots-grid" style="display: none;">
       
    </div>
    <div class="modal fade" id="editLotModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Parking Lot</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editLotForm">
                        <input type="hidden" id="editLotId">
                        <div class="mb-3">
                            <label class="form-label">Location Name:</label>
                            <input type="text" class="form-control" id="editLotName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address:</label>
                            <input type="text" class="form-control" id="editLotAddress" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Pin Code:</label>
                            <input type="text" class="form-control" id="editPinCode" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price per Hour (₹):</label>
                            <input type="number" class="form-control" id="editPricePerHour" min="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Total Spots:</label>
                            <input type="number" class="form-control" id="editTotalSpots" min="5" max="50" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateLot()">Update</button>
                </div>
            </div>
        </div>
    </div>    
    <script>
        let parkingLots = [];

        async function loadParkingLots() {
            try {
                const response = await fetch('/api/lots');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                parkingLots = await response.json();
               
            } catch (error) {
                parkingLots = [];
            }
        }

        async function initializeApp() {
            try {
                await loadParkingLots();
                updateDisplay();
            } catch (error) {
                console.log(`❌ App initialization failed: ${error.message}`, error);
            }
        }

        function updateDisplay() {
            const container = document.getElementById('parkingLotsContainer');
            const emptyState = document.getElementById('emptyState');
            const legend = document.getElementById('legend');
            
            if (parkingLots.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'block';
                legend.style.display = 'none';
            } else {
                container.style.display = 'grid';
                emptyState.style.display = 'none';
                legend.style.display = 'block';
                renderAllParkingLots();
            }
        }

        function renderAllParkingLots() {
            const container = document.getElementById('parkingLotsContainer');
            container.innerHTML = '';
            parkingLots.forEach(lot => {
                addLotToDOM(lot);
                renderParkingLot(lot);
            });
        }

        function addLotToDOM(lot) {
            const container = document.getElementById('parkingLotsContainer');
            const isEmpty = lot.occupiedSpots === 0;
            const statusText = isEmpty ? 'Green | Available' : 'Red | Busy';
            const statusClass = isEmpty ? 'status-green' : 'status-red';
            
            const lotHtml = `
                <div class="parking-lot" id="lot-container-${lot.id}">
                    <div class="lot-header">
                        <div class="lot-title">${lot.name}</div>
                        <div class="lot-actions">
                            <button class="btn-edit-lot" onclick="editLot(${lot.id})">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="btn-delete-lot" 
                                    onclick="deleteLot(${lot.id})"
                                    ${!isEmpty ? 'disabled' : ''}
                                    title="${isEmpty ? 'Delete this parking lot' : 'Cannot delete - lot has occupied spots'}">
                                <i class="fas fa-trash"></i>
                                Delete
                            </button>
                        </div>
                    </div>
                    <div class="lot-info">
                        <div><i class="fas fa-map-marker-alt"></i> ${lot.address}</div>
                        <div><i class="fas fa-money-bill"></i> ₹${lot.pricePerHour}/hour</div>
                    </div>
                    <div class="parking-grid" id="parking-grid-${lot.id}"></div>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', lotHtml);
        }

        function renderParkingLot(lot) {
            const gridElement = document.getElementById(`parking-grid-${lot.id}`);
            if (!gridElement) {
                return;
            }

            gridElement.innerHTML = '';
            
            for (let i = 1; i <= lot.totalSpots; i++) {
                const spot = lot.spots.find(s => s.id === i) || { id: i, occupied: false };
                const spotElement = document.createElement('div');
                spotElement.className = `parking-spot ${spot.occupied ? 'spot-occupied' : 'spot-available'}`;
                spotElement.textContent = spot.occupied ? 'O' : 'A';
                
                spotElement.setAttribute('data-lot-id', lot.id);
                spotElement.setAttribute('data-spot-id', spot.id);
                
                spotElement.addEventListener('mouseenter', (e) => showSpotInfo(e, lot.id, spot.id));
                spotElement.addEventListener('mouseleave', hideSpotInfo);
                
                spotElement.style.cursor = spot.occupied ? 'help' : 'default';
                
                gridElement.appendChild(spotElement);
            }
        }

        async function showSpotInfo(event, lotId, spotId) {
            const spotElement = event.target;
            
            if (!spotElement.classList.contains('spot-occupied')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/lots/${lotId}/spots/${spotId}/info`);
                if (response.ok) {
                    const spotInfo = await response.json();
                    showTooltip(event, spotInfo);
                }
            } catch (error) {
                console.error('Error fetching spot info:', error);
            }
        }

        function hideSpotInfo() {
            const tooltip = document.getElementById('spotTooltip');
            if (tooltip) {
                tooltip.remove();
            }
        }

        function showTooltip(event, spotInfo) {
            hideSpotInfo();
            
            const tooltip = document.createElement('div');
            tooltip.id = 'spotTooltip';
            tooltip.className = 'spot-tooltip';
            
            let tooltipContent = `
                <div class="tooltip-header">
                    <strong>Parking Spot ${spotInfo.spotId}</strong>
                </div>
                <div class="tooltip-body">
                    <p><strong>Status:</strong> ${spotInfo.status}</p>
                    <p><strong>Lot:</strong> ${spotInfo.lotName}</p>
                    <p><strong>Price:</strong> ₹${spotInfo.pricePerHour}/hour</p>
            `;
            
            if (spotInfo.status === 'Occupied' && spotInfo.userId) {
                const isOverdue = spotInfo.isOverdue ? ' (OVERDUE)' : '';
                tooltipContent += `
                    <hr>
                    <p><strong>User ID:</strong> ${spotInfo.userId}</p>
                    <p><strong>User Name:</strong> ${spotInfo.userName}</p>
                    <p><strong>Vehicle:</strong> ${spotInfo.vehicleNumber}</p>
                    <p><strong>Contact:</strong> ${spotInfo.contactNumber}</p>
                    <p><strong>Start Time:</strong> ${spotInfo.parkingStartTime}</p>
                    <p><strong>Expected End:</strong> ${spotInfo.expectedEndTime}</p>
                    <p><strong>Duration:</strong> ${spotInfo.actualDuration}h / ${spotInfo.expectedDuration}h${isOverdue}</p>
                    <p><strong>Cost:</strong> ₹${spotInfo.actualCost} / ₹${spotInfo.expectedCost}</p>
                `;
                
                if (spotInfo.isOverdue) {
                    tooltipContent += `<p class="overdue-warning"><strong>⚠️ Overdue by ${spotInfo.overdueHours}h</strong></p>`;
                }
            }
            
            tooltipContent += `</div>`;
            tooltip.innerHTML = tooltipContent;
            
            const rect = event.target.getBoundingClientRect();
            tooltip.style.position = 'fixed';
            tooltip.style.left = (rect.right + 10) + 'px';
            tooltip.style.top = rect.top + 'px';
            tooltip.style.zIndex = '9999';
            
            document.body.appendChild(tooltip);
        }

        async function deleteLot(lotId) {
            if (!confirm('Are you sure you want to delete this parking lot?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/lots/${lotId}`, { method: 'DELETE' });
                if (response.ok) {
                    console.log('✅ Lot deleted successfully');
                    await loadParkingLots();
                    updateDisplay();
                } else {
                    const error = await response.json();
                    console.log(`❌ Failed to delete lot: ${error.error}`);
                }
            } catch (error) {
                console.log(`❌ Network error: ${error.message}`);
            }
        }

        function toggleAddLotForm() {
            const form = document.getElementById('addLotForm');
            const isVisible = form.style.display === 'block';
            form.style.display = isVisible ? 'none' : 'block';
            
            if (!isVisible) {
                document.getElementById('lotName').focus();
            }
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            await addNewLot();
        }

        async function addNewLot() {
            const name = document.getElementById('lotName').value.trim();
            const address = document.getElementById('address').value.trim();
            const pinCode = document.getElementById('pinCode').value.trim();
            const pricePerHour = parseFloat(document.getElementById('pricePerHour').value);
            const totalSpots = parseInt(document.getElementById('lotSpots').value);

            if (!name || !address || !pinCode) {
                alert('Please fill in all required fields');
                return;
            }

            if (pricePerHour <= 0) {
                alert('Price must be greater than 0');
                return;
            }

            if (totalSpots < 5 || totalSpots > 50) {
                alert('Total spots must be between 5 and 50');
                return;
            }

            if (parkingLots.some(lot => lot.name.toLowerCase() === name.toLowerCase())) {
                alert('A parking lot with this name already exists!');
                return;
            }

            const apiData = {
                name,
                address,
                pinCode,
                pricePerHour,
                totalSpots
            };

            try {
                const response = await fetch('/api/lots', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(apiData)
                });

                const responseData = await response.json();

                if (response.ok) {
                    document.getElementById('lotForm').reset();
                    document.getElementById('pricePerHour').value = '20';
                    document.getElementById('lotSpots').value = '10';
                    
                    await loadParkingLots();
                    updateDisplay();
                    toggleAddLotForm();
                    
                    alert(`Parking lot "${name}" created successfully!`);
                } else {
                    console.log('❌ API Error:', responseData);
                }
            } catch (error) {
                console.log('❌ Network Error:', error);
            }
        }

        function editLot(lotId) {
            const lot = parkingLots.find(l => l.id === lotId);
            if (!lot) {
                return alert('Lot not found');
            }
       
            document.getElementById('editLotId').value = lot.id;
            document.getElementById('editLotName').value = lot.name;
            document.getElementById('editLotAddress').value = lot.address;
            document.getElementById('editPinCode').value = lot.pinCode;
            document.getElementById('editPricePerHour').value = lot.pricePerHour;
            document.getElementById('editTotalSpots').value = lot.totalSpots;

            const modal = new bootstrap.Modal(document.getElementById('editLotModal'));
            modal.show();
        }

        async function updateLot() {
            const lotId = document.getElementById('editLotId').value;
            const updatedLot = {
                name: document.getElementById('editLotName').value.trim(),
                address: document.getElementById('editLotAddress').value.trim(),
                pinCode: document.getElementById('editPinCode').value.trim(),
                pricePerHour: parseFloat(document.getElementById('editPricePerHour').value),
                totalSpots: parseInt(document.getElementById('editTotalSpots').value)
            };

            if (!updatedLot.name || !updatedLot.address || !updatedLot.pinCode) {
                return alert('Please fill in all required fields');
            }

            if (updatedLot.pricePerHour <= 0) {
                return alert('Price must be greater than 0');
            }

            try {
                const response = await fetch(`/api/lots/${lotId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(updatedLot)
                });

                const data = await response.json();
                
                if (response.ok) {
                    console.log('✅ Lot updated successfully!');
                    
                    bootstrap.Modal.getInstance(document.getElementById('editLotModal')).hide();
                    await loadParkingLots();
                    updateDisplay();
                    alert('Parking lot updated successfully!');
                } else {
                    console.log('❌ Update failed:', data.error);
                }
            } catch (error) {
                console.log('❌ Network error:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initializeApp();
            
            setInterval(async () => {
                try {
                    await loadParkingLots();
                    updateDisplay();
                } catch (error) {
                    console.error('Auto-refresh error:', error);
                }
            }, 30000);
        });
    </script>
</body>
</html>
