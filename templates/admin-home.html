<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Lots Management</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #E8D5F0;
            --light-purple: #F5F0FF;
            --dark-purple: #D4C4E3;
            --accent-purple: #F0E6FF;
            --medium-purple: #E0D0F0;
            --text-dark: #4A4A4A;
        }

        .parking-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(212, 196, 227, 0.3);
            padding: 30px;
            margin: 20px 0;
        }

        .section-title {
            color: var(--dark-purple);
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: var(--medium-purple);
            border-radius: 2px;
        }

        .parking-lot {
            background: rgba(248, 249, 250, 0.8);
            border: 2px solid var(--light-purple);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
            position: relative;
            height: 100%;
        }

        .parking-lot:hover {
            transform: translateY(-2px);
        }

        .lot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .lot-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-dark);
            margin: 0;
        }

        .lot-actions {
            display: flex;
            gap: 8px;
        }

        .btn-delete-lot {
            background: #dc3545;
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-delete-lot:hover {
            background: #c82333;
            transform: scale(1.05);
        }

        .btn-delete-lot:disabled {
            background: #6c757d;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .lot-status {
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .status-red {
            color: #dc3545;
            font-weight: 600;
        }

        .status-green {
            color: #28a745;
            font-weight: 600;
        }

        .parking-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-width: 100%;
            justify-content: center;
        }

        .parking-spot {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            border: 2px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .spot-available {
            background-color: #28a745;
            border-color: #1e7e34;
            color: white;
        }

        .spot-occupied {
            background-color: #dc3545;
            border-color: #c82333;
            color: white;
        }

        .spot-available:hover {
            background-color: #218838;
            transform: scale(1.1);
        }

        .spot-occupied:hover {
            background-color: #c82333;
            transform: scale(1.1);
        }

        .btn-add-lot {
            background: linear-gradient(45deg, var(--primary-purple), var(--medium-purple));
            border: 2px solid var(--dark-purple);
            color: #444;
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-add-lot:hover {
            background: linear-gradient(45deg, var(--medium-purple), var(--dark-purple));
            color: #333;
            transform: translateY(-2px);
        }

        .legend {
            background: rgba(232, 213, 240, 0.2);
            border: 1px solid var(--medium-purple);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .legend-spot {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 2px solid;
        }

        .add-lot-form {
            background: rgba(248, 249, 250, 0.9);
            border: 2px dashed var(--medium-purple);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .form-control {
            border: 2px solid var(--light-purple);
            border-radius: 8px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.9);
        }

        .form-control:focus {
            border-color: var(--medium-purple);
            box-shadow: 0 0 0 0.2rem rgba(232, 213, 240, 0.25);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dark);
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--medium-purple);
            margin-bottom: 20px;
        }

        .parking-lots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn-edit-lot {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }

        .btn-edit-lot:hover {
            background-color: #0056b3;
        }

        /* Tooltip Styles for Spot Information */
        .spot-tooltip {
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            max-width: 300px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid #444;
        }

        .tooltip-header {
            border-bottom: 1px solid #555;
            padding-bottom: 8px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #fff;
        }

        .tooltip-body p {
            margin: 4px 0;
            line-height: 1.4;
        }

        .tooltip-body hr {
            border-color: #555;
            margin: 8px 0;
        }

        .overdue-warning {
            color: #ff6b6b !important;
            font-weight: bold;
            background: rgba(255, 107, 107, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            border-left: 3px solid #ff6b6b;
        }

        /* Update parking spot hover styles */
        .spot-occupied:hover {
            background-color: #a71e2a !important;
            transform: scale(1.1);
            cursor: help;
        }

        .spot-available:hover {
            background-color: #1e6b31 !important;
            transform: scale(1.05);
            cursor: default;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="parking-container">
            <!-- Debug Panel -->
            <div id="debug-panel" style="background: #f8f9fa; border: 1px solid #dee2e6; padding: 10px; margin-bottom: 20px; border-radius: 5px;">
                <h6>Debug Info:</h6>
                <div id="debug-info">
                    <p>Lots loaded: <span id="lots-count">0</span></p>
                    <p>Last action: <span id="last-action">None</span></p>
                </div>
            </div>

            <!-- Header with Add Button -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="section-title">Parking Lots Management</h2>
                <div>
                    <button class="btn btn-add-lot" onclick="toggleAddLotForm()">
                        <i class="fas fa-plus me-2"></i>Add New Lot
                    </button>
                </div>
            </div>

            <!-- Add New Lot Form -->
            <div id="addLotForm" class="add-lot-form">
                <h5 class="mb-3">Add New Parking Lot</h5>
                <form id="lotForm" onsubmit="handleFormSubmit(event)">
                    <div class="row">
                        <div class="col-md-4">
                            <label class="form-label">Location Name:</label>
                            <input type="text" class="form-control" id="lotName" placeholder="Location" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Address:</label>
                            <input type="text" class="form-control" id="address" placeholder="123 Main Street" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Pin Code:</label>
                            <input type="text" class="form-control" id="pinCode" placeholder="400010" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Price/Hour (₹):</label>
                            <input type="number" class="form-control" id="pricePerHour" value="20" min="1" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Maximum Spots:</label>
                            <input type="number" class="form-control" id="lotSpots" value="10" min="5" max="50" required>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-success me-2">
                                <i class="fas fa-check me-1"></i>Add
                            </button>
                            <button type="button" class="btn btn-secondary" onclick="toggleAddLotForm()">
                                <i class="fas fa-times me-1"></i>Cancel
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="empty-state">
                <i class="fas fa-parking"></i>
                <h4>No Parking Lots Created Yet</h4>
                <p>Get started by adding your first parking lot using the "Add New Lot" button above.</p>
            </div>

            <!-- Parking Lots Container -->
            <div id="parkingLotsContainer" class="parking-lots-grid" style="display: none;">
                <!-- Parking lots will be dynamically generated here -->
            </div>

            <!-- Legend -->
            <div class="legend" id="legend" style="display: none;">
                <h6 class="fw-bold mb-3">Legend:</h6>
                <div class="row">
                    <div class="col-md-3">
                        <div class="legend-item">
                            <div class="legend-spot spot-available"></div>
                            <span>Available Spot</span>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="legend-item">
                            <div class="legend-spot spot-occupied"></div>
                            <span>Occupied Spot</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="legend-item">
                            <i class="fas fa-info-circle text-info me-2"></i>
                            <span><strong>Click spots to toggle occupancy</strong></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Lot Modal -->
    <div class="modal fade" id="editLotModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Parking Lot</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editLotForm">
                        <input type="hidden" id="editLotId">
                        <div class="mb-3">
                            <label class="form-label">Location Name:</label>
                            <input type="text" class="form-control" id="editLotName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address:</label>
                            <input type="text" class="form-control" id="editLotAddress" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Pin Code:</label>
                            <input type="text" class="form-control" id="editPinCode" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price per Hour (₹):</label>
                            <input type="number" class="form-control" id="editPricePerHour" min="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Total Spots:</label>
                            <input type="number" class="form-control" id="editTotalSpots" min="5" max="50" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateLot()">Update</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    
    <script>
        console.log('🚀 Simple admin-home.html script starting...');
        
        // Global state
        let parkingLots = [];

        // Debug helper
        function updateDebugInfo(action = '') {
            document.getElementById('lots-count').textContent = parkingLots.length;
            if (action) document.getElementById('last-action').textContent = action;
        }

        function debugLog(message, data = null) {
            const timestamp = new Date().toLocaleTimeString();
            console.log(`[${timestamp}] 🔧 ${message}`, data || '');
            updateDebugInfo(message);
        }

        // Load parking lots
        async function loadParkingLots() {
            debugLog('🔄 Loading parking lots...');
            try {
                const response = await fetch('/api/lots');
                debugLog(`📡 Response status: ${response.status}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                parkingLots = await response.json();
                debugLog(`✅ Loaded ${parkingLots.length} parking lots`, parkingLots);
                
            } catch (error) {
                debugLog(`❌ Failed to load parking lots: ${error.message}`, error);
                parkingLots = [];
            }
        }

        // Initialize app
        async function initializeApp() {
            debugLog('🏁 Initializing app...');
            try {
                await loadParkingLots();
                updateDisplay();
                debugLog('✅ App initialized successfully');
            } catch (error) {
                debugLog(`❌ App initialization failed: ${error.message}`, error);
            }
        }

        // Update display
        function updateDisplay() {
            const container = document.getElementById('parkingLotsContainer');
            const emptyState = document.getElementById('emptyState');
            const legend = document.getElementById('legend');
            
            if (parkingLots.length === 0) {
                container.style.display = 'none';
                emptyState.style.display = 'block';
                legend.style.display = 'none';
            } else {
                container.style.display = 'grid';
                emptyState.style.display = 'none';
                legend.style.display = 'block';
                renderAllParkingLots();
            }
        }

        // Render all parking lots
        function renderAllParkingLots() {
            const container = document.getElementById('parkingLotsContainer');
            container.innerHTML = '';
            parkingLots.forEach(lot => {
                addLotToDOM(lot);
                renderParkingLot(lot);
            });
        }

        // Add lot HTML to DOM
        function addLotToDOM(lot) {
            const container = document.getElementById('parkingLotsContainer');
            const isEmpty = lot.occupiedSpots === 0;
            const statusText = isEmpty ? 'Green | Available' : 'Red | Busy';
            const statusClass = isEmpty ? 'status-green' : 'status-red';
            
            const lotHtml = `
                <div class="parking-lot" id="lot-container-${lot.id}">
                    <div class="lot-header">
                        <div class="lot-title">${lot.name}</div>
                        <div class="lot-actions">
                            <button class="btn btn-primary btn-sm me-2" onclick="editLot(${lot.id})">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="btn-delete-lot" 
                                    onclick="deleteLot(${lot.id})"
                                    ${!isEmpty ? 'disabled' : ''}
                                    title="${isEmpty ? 'Delete this parking lot' : 'Cannot delete - lot has occupied spots'}">
                                <i class="fas fa-trash"></i>
                                Delete
                            </button>
                        </div>
                    </div>
                    <div class="lot-info">
                        <span><i class="fas fa-map-marker-alt"></i> ${lot.address}</span>
                        <span><i class="fas fa-money-bill"></i> ₹${lot.pricePerHour}/hour</span>
                        <span class="lot-status ${statusClass}"><i class="fas fa-circle"></i> ${statusText}</span>
                    </div>
                    <div class="parking-grid" id="parking-grid-${lot.id}"></div>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', lotHtml);
        }

        // Render parking lot spots
        function renderParkingLot(lot) {
            // Fix: Changed from lot${lot.id}-grid to parking-grid-${lot.id}
            const gridElement = document.getElementById(`parking-grid-${lot.id}`);
            if (!gridElement) {
                debugLog(`❌ Grid element not found for lot ${lot.id}`);
                return;
            }

            gridElement.innerHTML = '';
            
            // Create spots based on totalSpots
            for (let i = 1; i <= lot.totalSpots; i++) {
                const spot = lot.spots.find(s => s.id === i) || { id: i, occupied: false };
                const spotElement = document.createElement('div');
                spotElement.className = `parking-spot ${spot.occupied ? 'spot-occupied' : 'spot-available'}`;
                spotElement.textContent = spot.occupied ? 'O' : 'A';
                
                // Add data attributes for spot information
                spotElement.setAttribute('data-lot-id', lot.id);
                spotElement.setAttribute('data-spot-id', spot.id);
                
                // Add hover functionality instead of click to toggle
                spotElement.addEventListener('mouseenter', (e) => showSpotInfo(e, lot.id, spot.id));
                spotElement.addEventListener('mouseleave', hideSpotInfo);
                
                // Make spots non-clickable (read-only)
                spotElement.style.cursor = spot.occupied ? 'help' : 'default';
                
                gridElement.appendChild(spotElement);
            }
            
            debugLog(`✅ Rendered ${lot.totalSpots} spots for lot ${lot.id}`);
        }

        // Show spot information on hover
        async function showSpotInfo(event, lotId, spotId) {
            const spotElement = event.target;
            
            // Only show info for occupied spots
            if (!spotElement.classList.contains('spot-occupied')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/lots/${lotId}/spots/${spotId}/info`);
                if (response.ok) {
                    const spotInfo = await response.json();
                    showTooltip(event, spotInfo);
                }
            } catch (error) {
                console.error('Error fetching spot info:', error);
            }
        }

        // Hide spot information tooltip
        function hideSpotInfo() {
            const tooltip = document.getElementById('spotTooltip');
            if (tooltip) {
                tooltip.remove();
            }
        }

        // Show tooltip with spot information
        function showTooltip(event, spotInfo) {
            // Remove existing tooltip
            hideSpotInfo();
            
            const tooltip = document.createElement('div');
            tooltip.id = 'spotTooltip';
            tooltip.className = 'spot-tooltip';
            
            let tooltipContent = `
                <div class="tooltip-header">
                    <strong>Parking Spot ${spotInfo.spotId}</strong>
                </div>
                <div class="tooltip-body">
                    <p><strong>Status:</strong> ${spotInfo.status}</p>
                    <p><strong>Lot:</strong> ${spotInfo.lotName}</p>
                    <p><strong>Price:</strong> ₹${spotInfo.pricePerHour}/hour</p>
            `;
            
            if (spotInfo.status === 'Occupied' && spotInfo.userId) {
                const isOverdue = spotInfo.isOverdue ? ' (OVERDUE)' : '';
                tooltipContent += `
                    <hr>
                    <p><strong>User ID:</strong> ${spotInfo.userId}</p>
                    <p><strong>User Name:</strong> ${spotInfo.userName}</p>
                    <p><strong>Vehicle:</strong> ${spotInfo.vehicleNumber}</p>
                    <p><strong>Contact:</strong> ${spotInfo.contactNumber}</p>
                    <p><strong>Start Time:</strong> ${spotInfo.parkingStartTime}</p>
                    <p><strong>Expected End:</strong> ${spotInfo.expectedEndTime}</p>
                    <p><strong>Duration:</strong> ${spotInfo.actualDuration}h / ${spotInfo.expectedDuration}h${isOverdue}</p>
                    <p><strong>Cost:</strong> ₹${spotInfo.actualCost} / ₹${spotInfo.expectedCost}</p>
                `;
                
                if (spotInfo.isOverdue) {
                    tooltipContent += `<p class="overdue-warning"><strong>⚠️ Overdue by ${spotInfo.overdueHours}h</strong></p>`;
                }
            }
            
            tooltipContent += `</div>`;
            tooltip.innerHTML = tooltipContent;
            
            // Position tooltip
            const rect = event.target.getBoundingClientRect();
            tooltip.style.position = 'fixed';
            tooltip.style.left = (rect.right + 10) + 'px';
            tooltip.style.top = rect.top + 'px';
            tooltip.style.zIndex = '9999';
            
            document.body.appendChild(tooltip);
        }

        // Remove the old toggle function - spots are now read-only
        // async function toggleSpot(lotId, spotId) { ... } - REMOVED

        // Delete lot
        async function deleteLot(lotId) {
            if (!confirm('Are you sure you want to delete this parking lot?')) {
                return;
            }
            
            debugLog(`🗑️ Deleting lot ${lotId}`);
            try {
                const response = await fetch(`/api/lots/${lotId}`, { method: 'DELETE' });
                if (response.ok) {
                    debugLog('✅ Lot deleted successfully');
                    await loadParkingLots();
                    updateDisplay();
                    alert('Parking lot deleted successfully!');
                } else {
                    const error = await response.json();
                    debugLog(`❌ Failed to delete lot: ${error.error}`);
                    alert('Failed to delete lot: ' + error.error);
                }
            } catch (error) {
                debugLog(`❌ Network error: ${error.message}`);
                alert('Network error: ' + error.message);
            }
        }

        // Toggle add lot form
        function toggleAddLotForm() {
            debugLog('🔄 Toggling add lot form...');
            const form = document.getElementById('addLotForm');
            const isVisible = form.style.display === 'block';
            form.style.display = isVisible ? 'none' : 'block';
            
            if (!isVisible) {
                document.getElementById('lotName').focus();
            }
        }

        // Handle form submission
        async function handleFormSubmit(event) {
            event.preventDefault();
            debugLog('📝 Form submitted');
            await addNewLot();
        }

        // Add new lot
        async function addNewLot() {
            debugLog('🚀 Starting add new lot process...');
            
            // Get form values
            const name = document.getElementById('lotName').value.trim();
            const address = document.getElementById('address').value.trim();
            const pinCode = document.getElementById('pinCode').value.trim();
            const pricePerHour = parseFloat(document.getElementById('pricePerHour').value);
            const totalSpots = parseInt(document.getElementById('lotSpots').value);

            debugLog('📝 Form data:', { name, address, pinCode, pricePerHour, totalSpots });

            // Validation
            if (!name || !address || !pinCode) {
                alert('Please fill in all required fields');
                return;
            }

            if (pricePerHour <= 0) {
                alert('Price must be greater than 0');
                return;
            }

            if (totalSpots < 5 || totalSpots > 50) {
                alert('Total spots must be between 5 and 50');
                return;
            }

            // Check for duplicate names
            if (parkingLots.some(lot => lot.name.toLowerCase() === name.toLowerCase())) {
                alert('A parking lot with this name already exists!');
                return;
            }

            // Prepare API request
            const apiData = {
                name,
                address,
                pinCode,
                pricePerHour,
                totalSpots
            };

            debugLog('📡 Sending API request:', apiData);

            try {
                const response = await fetch('/api/lots', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(apiData)
                });

                debugLog(`📡 Response status: ${response.status}`);

                const responseData = await response.json();
                debugLog(`📡 Response data:`, responseData);

                if (response.ok) {
                    debugLog('✅ Lot created successfully!');
                    
                    // Clear form
                    document.getElementById('lotForm').reset();
                    document.getElementById('pricePerHour').value = '20';
                    document.getElementById('lotSpots').value = '10';
                    
                    // Reload data and update display
                    await loadParkingLots();
                    updateDisplay();
                    toggleAddLotForm();
                    
                    alert(`Parking lot "${name}" created successfully!`);
                    
                } else {
                    debugLog('❌ API Error:', responseData);
                    alert(`Failed to create parking lot: ${responseData.error || 'Unknown error'}`);
                }

            } catch (error) {
                debugLog('❌ Network Error:', error);
                alert(`Network error: ${error.message}`);
            }
        }

        // Edit lot
        function editLot(lotId) {
            debugLog(`Opening edit modal for lot ${lotId}`);
            const lot = parkingLots.find(l => l.id === lotId);
            if (!lot) {
                debugLog('❌ Lot not found:', lotId);
                return alert('Lot not found');
            }
            
            // Fill form fields
            document.getElementById('editLotId').value = lot.id;
            document.getElementById('editLotName').value = lot.name;
            document.getElementById('editLotAddress').value = lot.address;
            document.getElementById('editPinCode').value = lot.pinCode;
            document.getElementById('editPricePerHour').value = lot.pricePerHour;
            document.getElementById('editTotalSpots').value = lot.totalSpots;

            debugLog('✅ Edit form populated with lot data:', lot);

            // Show modal
            const modal = new bootstrap.Modal(document.getElementById('editLotModal'));
            modal.show();
        }

        // Update lot
        async function updateLot() {
            const lotId = document.getElementById('editLotId').value;
            const updatedLot = {
                name: document.getElementById('editLotName').value.trim(),
                address: document.getElementById('editLotAddress').value.trim(),
                pinCode: document.getElementById('editPinCode').value.trim(),
                pricePerHour: parseFloat(document.getElementById('editPricePerHour').value),
                totalSpots: parseInt(document.getElementById('editTotalSpots').value)
            };

            debugLog('📝 Attempting to update lot:', updatedLot);

            // Validation
            if (!updatedLot.name || !updatedLot.address || !updatedLot.pinCode) {
                debugLog('❌ Validation failed: Missing required fields');
                return alert('Please fill in all required fields');
            }

            if (updatedLot.pricePerHour <= 0) {
                debugLog('❌ Validation failed: Invalid price');
                return alert('Price must be greater than 0');
            }

            if (updatedLot.totalSpots < 5 || updatedLot.totalSpots > 50) {
                debugLog('❌ Validation failed: Invalid number of spots');
                return alert('Total spots must be between 5 and 50');
            }

            try {
                debugLog('📡 Sending update request...');
                const response = await fetch(`/api/lots/${lotId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(updatedLot)
                });

                const data = await response.json();
                
                if (response.ok) {
                    debugLog('✅ Lot updated successfully!');
                    // Close modal
                    bootstrap.Modal.getInstance(document.getElementById('editLotModal')).hide();
                    // Reload parking lots and update display
                    await loadParkingLots();
                    updateDisplay();
                    alert('Parking lot updated successfully!');
                } else {
                    debugLog('❌ Update failed:', data.error);
                    alert(data.error || 'Failed to update parking lot');
                }
            } catch (error) {
                debugLog('❌ Network error:', error);
                alert('Network error: ' + error.message);
            }
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            debugLog('🏁 DOM Content Loaded');
            initializeApp();
            
            // Auto-refresh every 30 seconds to reflect real-time bookings/releases
            setInterval(async () => {
                debugLog('🔄 Auto-refreshing parking lots data...');
                try {
                    await loadParkingLots();
                    updateDisplay();
                } catch (error) {
                    console.error('Auto-refresh error:', error);
                }
            }, 30000); // Refresh every 30 seconds
        });

        debugLog('✅ Script setup complete');
    </script>
</body>
</html>
