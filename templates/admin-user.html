<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users Management</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23B855C7' d='M135.2 117.4L109.1 192H402.9l-26.1-74.6C372.3 104.6 360.2 96 346.6 96H165.4c-13.6 0-25.7 8.6-30.2 21.4zM39.6 196.8L74.8 96.3C88.3 57.8 124.6 32 165.4 32H346.6c40.8 0 77.1 25.8 90.6 64.3l35.2 100.5c23.2 9.6 39.6 32.5 39.6 59.2V304c0 17.7-14.3 32-32 32H448c0 53-43 96-96 96s-96-43-96-96H256c0 53-43 96-96 96s-96-43-96-96H32c-17.7 0-32-14.3-32-32V256c0-26.7 16.4-49.6 39.6-59.2zM128 288a32 32 0 1 1 0 64 32 32 0 1 1 0-64zm288 32a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z'/></svg>" type="image/svg+xml">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container-fluid">
        <div class="users-container">
            <div class="search-container">
                <div class="row align-items-center justify-content-end">
                    <div class="col-auto">
                        <input type="text" class="search-input" id="searchInput" 
                               placeholder="Search by email or name..." style="width: 300px;">
                    </div>
                    <div class="col-auto">
                        <div class="users-stats-compact">
                            <div class="stat-item">
                                <div class="stat-number" id="totalUsers">0</div>
                                <div class="stat-label">Total Users</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fas fa-users-slash"></i>
                <h4>No Users Found</h4>              
            </div>
            <div class="users-table-container" id="usersTableContainer" style="display: none;">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>S.No</th>
                                <th>Email</th>
                                <th>Full Name</th>
                                <th>Address</th>
                                <th>Pin Code</th>                               
                                <th>Registered</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            
                        </tbody>
                    </table>
                </div>
            </div>
            <div id="usersCountInfo" class="text-center text-muted mt-3" style="display: none;">
                <small>Showing <span id="displayedCount">0</span> of <span id="totalCount">0</span> users</small>
            </div>
        </div>
    </div>
    <div id="confirmationModal" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Confirm Action</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="modalMessage">Are you sure you want to perform this action?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmBtn" onclick="confirmAction()">Confirm</button>
                </div>
            </div>
        </div>
    </div>    
    <script>
        let users = [];
        let filteredUsers = [];
        let currentFilter = 'all';
        let pendingAction = null;

        async function loadUsers() {
            showLoading(true);
            try {
                const response = await fetch('/api/users');
                if (response.ok) {
                    users = await response.json();
                    applyFilters();
                    updateStatistics();
                    renderUsers();
                } else {
                    console.error('Failed to load users');
                    showEmptyState();
                }
            } catch (error) {
                console.error('Error loading users:', error);
                showEmptyState();
            } finally {
                showLoading(false);
            }
        }
        function showLoading(show) {
            document.getElementById('loadingSpinner').style.display = show ? 'block' : 'none';
            document.getElementById('usersTableContainer').style.display = show ? 'none' : 'block';
            document.getElementById('emptyState').style.display = 'none';
        }
        function showEmptyState() {
            document.getElementById('loadingSpinner').style.display = 'none';
            document.getElementById('usersTableContainer').style.display = 'none';
            document.getElementById('emptyState').style.display = 'block';
            document.getElementById('usersCountInfo').style.display = 'none';
        }
        function updateStatistics() {
            const total = users.length;
            document.getElementById('totalUsers').textContent = total;
        }
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            filteredUsers = users.filter(user => {         
                let searchMatch = true;
                if (searchTerm) {
                    searchMatch = user.email.toLowerCase().includes(searchTerm) ||
                                 user.fullName.toLowerCase().includes(searchTerm);
                }                
                return searchMatch;
            });
        }
        function renderUsers() {
            if (filteredUsers.length === 0) {
                showEmptyState();
                return;
            }

            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            filteredUsers.forEach((user, index) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td><span class="user-email">${user.email}</span></td>
                    <td>${user.fullName}</td>
                    <td>
                        <div class="user-details" id="address-${user.id}">
                            ${user.address}
                        </div>
                        ${user.address.length > 30 ? 
                            `<button class="expand-btn" onclick="toggleExpand('address-${user.id}')">...more</button>` : ''}
                    </td>
                    <td>${user.pinCode}</td>
                    
                    <td>${user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'N/A'}</td>
                    <td>
                        <div class="d-flex">
                         
                            <button class="btn-action btn-delete" onclick="confirmUserAction(${user.id}, 'delete', '${user.email}')" title="Delete User">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('usersTableContainer').style.display = 'block';
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('usersCountInfo').style.display = 'block';
            document.getElementById('displayedCount').textContent = filteredUsers.length;
            document.getElementById('totalCount').textContent = users.length;
        }

    
        function toggleExpand(elementId) {
            const element = document.getElementById(elementId);
            element.classList.toggle('expanded');
            
            const button = element.nextElementSibling;
            if (button && button.classList.contains('expand-btn')) {
                button.textContent = element.classList.contains('expanded') ? '...less' : '...more';
            }
        }

      
        function confirmUserAction(userId, action, userEmail) {
            let title, message, btnClass, btnText;
            
            switch(action) {            
                case 'delete':
                    title = 'Delete User';
                    message = `Are you sure you want to permanently delete user "${userEmail}"? This action cannot be undone.`;
                    btnClass = 'btn-danger';
                    btnText = 'Delete';
                    break;
            }
            
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            
            const confirmBtn = document.getElementById('confirmBtn');
            confirmBtn.className = `btn ${btnClass}`;
            confirmBtn.textContent = btnText;
            
            pendingAction = { userId, action };
            
            new bootstrap.Modal(document.getElementById('confirmationModal')).show();
        }
        async function confirmAction() {
            if (!pendingAction) return;
            
            const { userId, action } = pendingAction;
            
            try {
                let response;
                if (action === 'delete') {
                    response = await fetch(`/api/users/${userId}`, { method: 'DELETE' });
                } else {
                    const isActive = action === 'activate';
                    response = await fetch(`/api/users/${userId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ isActive })
                    });
                }
                
                if (response.ok) {
                    await loadUsers(); 
                    const actionText = action === 'delete' ? 'deleted' : `${action}d`;
                    alert(`User has been ${actionText} successfully!`);
                } else {
                    alert(`Failed to ${action} user.`);
                }
            } catch (error) {
                console.error(`Error ${action}ing user:`, error);
                alert(`Error occurred while ${action}ing user.`);
            }
            
            pendingAction = null;
            bootstrap.Modal.getInstance(document.getElementById('confirmationModal')).hide();
        }

   
        function refreshUsers() {
            loadUsers();
        }

      
        document.addEventListener('DOMContentLoaded', function() {            
            loadUsers();
       
            document.getElementById('searchInput').addEventListener('input', function() {
                applyFilters();
                renderUsers();
            });
         
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                 
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                  
                    this.classList.add('active');
                    
                    currentFilter = this.dataset.filter;
                    applyFilters();
                    renderUsers();
                });
            });
        });
    </script>
</body>
</html>
