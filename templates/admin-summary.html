<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23B855C7' d='M135.2 117.4L109.1 192H402.9l-26.1-74.6C372.3 104.6 360.2 96 346.6 96H165.4c-13.6 0-25.7 8.6-30.2 21.4zM39.6 196.8L74.8 96.3C88.3 57.8 124.6 32 165.4 32H346.6c40.8 0 77.1 25.8 90.6 64.3l35.2 100.5c23.2 9.6 39.6 32.5 39.6 59.2V304c0 17.7-14.3 32-32 32H448c0 53-43 96-96 96s-96-43-96-96H256c0 53-43 96-96 96s-96-43-96-96H32c-17.7 0-32-14.3-32-32V256c0-26.7 16.4-49.6 39.6-59.2zM128 288a32 32 0 1 1 0 64 32 32 0 1 1 0-64zm288 32a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z'/></svg>" type="image/svg+xml">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body>
    <div class="summary-container">
        <div class="stats-grid" id="statsGrid">    
        </div>
        <div id="loadingState" class="loading">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <h4 class="mt-3">Loading Dashboard Data...</h4>
        </div>        
        <div id="errorState" class="error-state" style="display: none;">
            <i class="fas fa-exclamation-triangle fa-2x"></i>
            <h4 class="mt-3">Unable to Load Dashboard</h4>            
        </div>       
        <div class="charts-row" id="chartsContainer" style="display: none;">
            <div class="chart-section">
                <h3 class="chart-title">Revenue</h3>
                <div class="chart-container">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>
            <div class="chart-section">
                <h3 class="chart-title">Available and Occupied Parking Lots</h3>
                <div class="chart-container">
                    <canvas id="occupancyChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let revenueChart = null;
        let occupancyChart = null;
        async function loadDashboard() {
            showLoading();            
            try {
                const statsResponse = await fetch('/api/stats/dashboard');
                if (!statsResponse.ok) throw new Error('Failed to fetch statistics');
                const stats = await statsResponse.json();
                const lotsResponse = await fetch('/api/lots');
                if (!lotsResponse.ok) throw new Error('Failed to fetch parking lots');
                const lots = await lotsResponse.json();
                displayStatistics(stats);
                displayCharts(lots, stats);
                showCharts();

            } catch (error) {
                console.error('Dashboard loading error:', error);
                showError();
            }
        }        
        function showLoading() {
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('errorState').style.display = 'none';
            document.getElementById('chartsContainer').style.display = 'none';
            document.getElementById('statsGrid').innerHTML = '';
        }

        function showError() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            document.getElementById('chartsContainer').style.display = 'none';
        }
        function showCharts() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'none';
            document.getElementById('chartsContainer').style.display = 'flex';
        }
        function displayStatistics(stats) {
            const statsGrid = document.getElementById('statsGrid');
            
            const statsCards = [
                {
                    icon: 'fas fa-building',
                    number: stats.totalLots || 0,
                    label: 'Total Parking Lots',
                    color: '#28a745'
                },
                {
                    icon: 'fas fa-car',
                    number: stats.totalSpots || 0,
                    label: 'Total Parking Spots',
                    color: '#007bff'
                },
                {
                    icon: 'fas fa-check-circle',
                    number: stats.occupiedSpots || 0,
                    label: 'Occupied Spots',
                    color: '#dc3545'
                },
                {
                    icon: 'fas fa-circle',
                    number: stats.availableSpots || 0,
                    label: 'Available Spots',
                    color: '#28a745'
                },        
                {
                    icon: 'fas fa-users',
                    number: stats.totalUsers || 0,
                    label: 'Total Users',
                    color: '#6f42c1'
                }
            ];
            statsGrid.innerHTML = statsCards.map(stat => `
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="${stat.icon}" style="color: ${stat.color}"></i>
                    </div>
                    <div class="stat-number">${stat.number}</div>
                    <div class="stat-label">${stat.label}</div>
                </div>
            `).join('');
        }
        function displayCharts(lots, stats) {
            const revenueData = lots.map(lot => ({
                name: lot.name,
                revenue: (lot.occupiedSpots * lot.pricePerHour * 24 * 30) 
            }));
            const occupancyData = lots.map(lot => ({
                name: lot.name,
                available: lot.totalSpots - lot.occupiedSpots,
                occupied: lot.occupiedSpots,
                total: lot.totalSpots
            }));

            createRevenueChart(revenueData);
            createOccupancyChart(occupancyData);
        }
        
        function createRevenueChart(data) {
            const ctx = document.getElementById('revenueChart').getContext('2d');
            
            if (revenueChart) {
                revenueChart.destroy();
            }
            const colors = [
                '#28a745', '#007bff', '#dc3545', '#fd7e14', 
                '#6f42c1', '#20c997', '#ffc107', '#e83e8c'
            ];

            revenueChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: data.map(item => item.name),
                    datasets: [{
                        data: data.map(item => item.revenue),
                        backgroundColor: colors.slice(0, data.length),
                        borderColor: '#fff',
                        borderWidth: 3,
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                font: {
                                    size: 12,
                                    weight: '500'
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `${context.label}: ₹${context.raw.toLocaleString()}/month`;
                                }
                            }
                        }
                    }
                                    }
            });
        }

        function createOccupancyChart(data) {
            const ctx = document.getElementById('occupancyChart').getContext('2d');
            
            if (occupancyChart) {
                occupancyChart.destroy();
            }

            occupancyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(item => item.name),
                    datasets: [
                        {
                            label: 'Available',
                            data: data.map(item => item.available),
                            backgroundColor: '#28a745',
                            borderColor: '#1e7e34',
                            borderWidth: 2,
                            borderRadius: 5
                        },
                        {
                            label: 'Occupied',
                            data: data.map(item => item.occupied),
                            backgroundColor: '#dc3545',
                            borderColor: '#c82333',
                            borderWidth: 2,
                            borderRadius: 5
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                padding: 20,
                                font: {
                                    size: 12,
                                    weight: '500'
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                afterLabel: function(context) {
                                    const total = data[context.dataIndex].total;
                                    const percentage = ((context.raw / total) * 100).toFixed(1);
                                    return `${percentage}% of total spots`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                font: {
                                    size: 11
                                }
                            }
                        },
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0,0,0,0.1)'
                            },
                            ticks: {
                                font: {
                                    size: 11
                                }
                            }
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Admin Summary Dashboard initializing...');
            loadDashboard();

            setInterval(() => {
                console.log('🔄 Auto-refreshing dashboard data...');
                loadDashboard();
            }, 120000);
        });

        window.addEventListener('resize', function() {
            if (revenueChart) revenueChart.resize();
            if (occupancyChart) occupancyChart.resize();
        });
    </script>
</body>
</html>
