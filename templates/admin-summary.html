<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Summary - Parking System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path fill='%23B855C7' d='M135.2 117.4L109.1 192H402.9l-26.1-74.6C372.3 104.6 360.2 96 346.6 96H165.4c-13.6 0-25.7 8.6-30.2 21.4zM39.6 196.8L74.8 96.3C88.3 57.8 124.6 32 165.4 32H346.6c40.8 0 77.1 25.8 90.6 64.3l35.2 100.5c23.2 9.6 39.6 32.5 39.6 59.2V304c0 17.7-14.3 32-32 32H448c0 53-43 96-96 96s-96-43-96-96H256c0 53-43 96-96 96s-96-43-96-96H32c-17.7 0-32-14.3-32-32V256c0-26.7 16.4-49.6 39.6-59.2zM128 288a32 32 0 1 1 0 64 32 32 0 1 1 0-64zm288 32a32 32 0 1 1 64 0 32 32 0 1 1 -64 0z'/></svg>" type="image/svg+xml">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        :root {
            --primary-green: #28a745;
            --light-green: #d4edda;
            --medium-green: #c3e6cb;
            --dark-green: #155724;
            --orange-accent: #fd7e14;
            --light-orange: #fff3cd;
        }

        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 50%, #dee2e6 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .header-bar {
            background: linear-gradient(45deg, var(--light-green), var(--medium-green));
            padding: 15px 30px;
            border-bottom: 3px solid var(--primary-green);
            border-radius: 20px;
            margin: 20px;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.2);
        }

        .welcome-text {
            color: var(--dark-green);
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0;
        }

        .nav-links {
            display: flex;
            gap: 5px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--dark-green);
            padding: 8px 16px;
            border-radius: 25px;
            transition: all 0.3s ease;
            font-weight: 500;
            border: 2px solid transparent;
        }

        .nav-links a:hover, .nav-links a.active {
            background: rgba(255, 255, 255, 0.8);
            border-color: var(--primary-green);
            color: var(--dark-green);
            transform: translateY(-2px);
        }

        .nav-separator {
            color: var(--dark-green);
            font-weight: bold;
            margin: 0 3px;
        }

        .edit-profile {
            background: var(--orange-accent);
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid var(--orange-accent);
        }

        .edit-profile:hover {
            background: white;
            color: var(--orange-accent);
            transform: translateY(-2px);
        }

        .summary-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin: 20px;
        }

        .summary-title {
            color: var(--orange-accent);
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            position: relative;
        }

        .summary-subtitle {
            color: #6c757d;
            text-align: center;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .chart-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            border: 2px solid #f8f9fa;
            transition: all 0.3s ease;
            height: 450px;
        }

        .chart-section:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            border-color: var(--primary-green);
        }

        .chart-title {
            color: var(--dark-green);
            font-size: 1.3rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--light-green);
        }

        .chart-container {
            position: relative;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(45deg, #fff, #f8f9fa);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border: 2px solid var(--light-green);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(40, 167, 69, 0.2);
        }

        .stat-icon {
            font-size: 2.5rem;
            color: var(--primary-green);
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark-green);
            margin-bottom: 5px;
        }

        .stat-label {
            color: #6c757d;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #6c757d;
        }

        .error-state {
            text-align: center;
            padding: 50px;
            color: #dc3545;
            background: rgba(220, 53, 69, 0.1);
            border-radius: 15px;
            border: 2px solid #dc3545;
        }

        /* Side-by-side charts layout */
        .charts-row {
            display: flex;
            gap: 20px;
            align-items: stretch;
        }

        .charts-row .chart-section {
            flex: 1;
        }

        @media (max-width: 968px) {
            .charts-row {
                flex-direction: column;
            }
            
            .header-bar {
                margin: 10px;
                padding: 15px 20px;
            }
            
            .nav-links {
                font-size: 0.9rem;
                gap: 2px;
            }
            
            .nav-links a {
                padding: 6px 12px;
            }
            
            .summary-container {
                margin: 10px;
                padding: 20px;
            }
            
            .summary-title {
                font-size: 1.5rem;
            }
            
            .chart-section {
                height: 400px;
                padding: 20px;
            }
            
            .chart-container {
                height: 300px;
            }
        }
    </style>
</head>
<body>
 
    <!-- Main Summary Container -->
    <div class="summary-container">
   

        <!-- Statistics Cards -->
        <div class="stats-grid" id="statsGrid">
            <!-- Stats will be loaded here -->
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="loading">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <h4 class="mt-3">Loading Dashboard Data...</h4>
            <p>Please wait while we fetch the latest statistics.</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="error-state" style="display: none;">
            <i class="fas fa-exclamation-triangle fa-2x"></i>
            <h4 class="mt-3">Unable to Load Dashboard</h4>
            <p>There was an error loading the dashboard data.</p>
            <button class="btn btn-outline-danger" onclick="loadDashboard()">
                <i class="fas fa-sync-alt me-2"></i>Retry
            </button>
        </div>

        <!-- Charts Row - Side by Side -->
        <div class="charts-row" id="chartsContainer" style="display: none;">
            <!-- Revenue Pie Chart -->
            <div class="chart-section">
                <h3 class="chart-title">Revenue from Each Parking Lot</h3>
                <div class="chart-container">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>

            <!-- Occupancy Bar Chart -->
            <div class="chart-section">
                <h3 class="chart-title">Summary on Available and Occupied Parking Lots</h3>
                <div class="chart-container">
                    <canvas id="occupancyChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let revenueChart = null;
        let occupancyChart = null;

        // Load dashboard data
        async function loadDashboard() {
            showLoading();
            
            try {
                // Fetch dashboard statistics
                const statsResponse = await fetch('/api/stats/dashboard');
                if (!statsResponse.ok) throw new Error('Failed to fetch statistics');
                const stats = await statsResponse.json();

                // Fetch parking lots for detailed analysis
                const lotsResponse = await fetch('/api/lots');
                if (!lotsResponse.ok) throw new Error('Failed to fetch parking lots');
                const lots = await lotsResponse.json();

                // Display statistics and charts
                displayStatistics(stats);
                displayCharts(lots, stats);
                showCharts();

            } catch (error) {
                console.error('Dashboard loading error:', error);
                showError();
            }
        }

        // Show loading state
        function showLoading() {
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('errorState').style.display = 'none';
            document.getElementById('chartsContainer').style.display = 'none';
            document.getElementById('statsGrid').innerHTML = '';
        }

        // Show error state
        function showError() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
            document.getElementById('chartsContainer').style.display = 'none';
        }

        // Show charts
        function showCharts() {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'none';
            document.getElementById('chartsContainer').style.display = 'flex';
        }

        // Display statistics cards
        function displayStatistics(stats) {
            const statsGrid = document.getElementById('statsGrid');
            
            const statsCards = [
                {
                    icon: 'fas fa-building',
                    number: stats.totalLots || 0,
                    label: 'Total Parking Lots',
                    color: '#28a745'
                },
                {
                    icon: 'fas fa-car',
                    number: stats.totalSpots || 0,
                    label: 'Total Parking Spots',
                    color: '#007bff'
                },
                {
                    icon: 'fas fa-check-circle',
                    number: stats.occupiedSpots || 0,
                    label: 'Occupied Spots',
                    color: '#dc3545'
                },
                {
                    icon: 'fas fa-circle',
                    number: stats.availableSpots || 0,
                    label: 'Available Spots',
                    color: '#28a745'
                },        
                {
                    icon: 'fas fa-users',
                    number: stats.totalUsers || 0,
                    label: 'Total Users',
                    color: '#6f42c1'
                }
            ];

            statsGrid.innerHTML = statsCards.map(stat => `
                <div class="stat-card">
                    <div class="stat-icon">
                        <i class="${stat.icon}" style="color: ${stat.color}"></i>
                    </div>
                    <div class="stat-number">${stat.number}</div>
                    <div class="stat-label">${stat.label}</div>
                </div>
            `).join('');
        }

        // Display charts
        function displayCharts(lots, stats) {
            // Prepare data for revenue chart (pie chart)
            const revenueData = lots.map(lot => ({
                name: lot.name,
                revenue: (lot.occupiedSpots * lot.pricePerHour * 24 * 30) // Monthly revenue estimation
            }));

            // Prepare data for occupancy chart (bar chart)
            const occupancyData = lots.map(lot => ({
                name: lot.name,
                available: lot.totalSpots - lot.occupiedSpots,
                occupied: lot.occupiedSpots,
                total: lot.totalSpots
            }));

            createRevenueChart(revenueData);
            createOccupancyChart(occupancyData);
        }

        // Create revenue pie chart (changed from donut to pie)
        function createRevenueChart(data) {
            const ctx = document.getElementById('revenueChart').getContext('2d');
            
            // Destroy existing chart if it exists
            if (revenueChart) {
                revenueChart.destroy();
            }

            const colors = [
                '#28a745', '#007bff', '#dc3545', '#fd7e14', 
                '#6f42c1', '#20c997', '#ffc107', '#e83e8c'
            ];

            revenueChart = new Chart(ctx, {
                type: 'pie', // Changed from 'doughnut' to 'pie'
                data: {
                    labels: data.map(item => item.name),
                    datasets: [{
                        data: data.map(item => item.revenue),
                        backgroundColor: colors.slice(0, data.length),
                        borderColor: '#fff',
                        borderWidth: 3,
                        hoverOffset: 10
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 20,
                                font: {
                                    size: 12,
                                    weight: '500'
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `${context.label}: ₹${context.raw.toLocaleString()}/month`;
                                }
                            }
                        }
                    }
                    // Removed cutout property to make it a full pie chart
                }
            });
        }

        // Create occupancy bar chart
        function createOccupancyChart(data) {
            const ctx = document.getElementById('occupancyChart').getContext('2d');
            
            // Destroy existing chart if it exists
            if (occupancyChart) {
                occupancyChart.destroy();
            }

            occupancyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(item => item.name),
                    datasets: [
                        {
                            label: 'Available',
                            data: data.map(item => item.available),
                            backgroundColor: '#28a745',
                            borderColor: '#1e7e34',
                            borderWidth: 2,
                            borderRadius: 5
                        },
                        {
                            label: 'Occupied',
                            data: data.map(item => item.occupied),
                            backgroundColor: '#dc3545',
                            borderColor: '#c82333',
                            borderWidth: 2,
                            borderRadius: 5
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                padding: 20,
                                font: {
                                    size: 12,
                                    weight: '500'
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                afterLabel: function(context) {
                                    const total = data[context.dataIndex].total;
                                    const percentage = ((context.raw / total) * 100).toFixed(1);
                                    return `${percentage}% of total spots`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                font: {
                                    size: 11
                                }
                            }
                        },
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(0,0,0,0.1)'
                            },
                            ticks: {
                                font: {
                                    size: 11
                                }
                            }
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });
        }

        // Initialize dashboard on page load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Admin Summary Dashboard initializing...');
            loadDashboard();

            // Auto-refresh every 2 minutes
            setInterval(() => {
                console.log('🔄 Auto-refreshing dashboard data...');
                loadDashboard();
            }, 120000);
        });

        // Handle window resize for responsive charts
        window.addEventListener('resize', function() {
            if (revenueChart) revenueChart.resize();
            if (occupancyChart) occupancyChart.resize();
        });
    </script>
</body>
</html>
